
name: Build Winners to School

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f pubspec.yaml || (echo "ERREUR: pubspec.yaml introuvable" && exit 1)
          test -f lib/main.dart || (echo "ERREUR: lib/main.dart introuvable" && exit 1)
          echo "Fichiers principaux trouves."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check Flutter project
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: dart analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: winners-to-school-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
